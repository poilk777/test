<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Вторая страница</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { min-height: 100vh; background: linear-gradient(135deg, #f093fb, #f5576c); display: flex; justify-content: center; align-items: center; }
        .container { text-align: center; padding: 40px; background: white; border-radius: 20px; max-width: 600px; width: 90%; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
        h1 { color: #333; margin-bottom: 20px; font-size: 2.5em; }
        p { color: #666; margin-bottom: 40px; font-size: 1.2em; }
        .buttons { display: flex; gap: 20px; justify-content: center; flex-wrap: wrap; }
        .btn { padding: 15px 30px; border: none; border-radius: 10px; font-size: 1.1em; cursor: pointer; transition: all 0.3s ease; text-decoration: none; display: inline-block; }
        .btn-secondary { background: white; color: #f5576c; border: 2px solid #f5576c; }
        .btn-secondary:hover { background: #f5576c; color: white; transform: translateY(-3px); }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎉 Вторая страница</h1>
        <p>Вы успешно перешли на вторую страницу нашего сайта!</p>
        <div class="buttons">
            <a href="index.html" class="btn btn-secondary">← На главную</a>
            <a href="register.html" class="btn btn-secondary">Регистрация</a>
            <a href="login.html" class="btn btn-secondary">Вход</a>
        </div>
    </div>
</body>
</html>
