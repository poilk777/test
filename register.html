<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Регистрация</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { min-height: 100vh; background: linear-gradient(135deg, #11998e, #38ef7d); display: flex; justify-content: center; align-items: center; padding: 20px; }
        .container { background: white; border-radius: 20px; padding: 40px; max-width: 450px; width: 100%; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
        h1 { color: #333; text-align: center; margin-bottom: 30px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; color: #333; margin-bottom: 8px; font-weight: 500; }
        input { width: 100%; padding: 12px 15px; border: 2px solid #ddd; border-radius: 10px; font-size: 1em; }
        input:focus { outline: none; border-color: #11998e; }
        button { width: 100%; padding: 15px; background: linear-gradient(135deg, #11998e, #38ef7d); color: white; border: none; border-radius: 10px; font-size: 1.1em; cursor: pointer; transition: all 0.3s ease; margin-top: 10px; }
        button:hover { transform: translateY(-3px); box-shadow: 0 10px 20px rgba(17,153,142,0.4); }
        .links { text-align: center; margin-top: 20px; }
        .links a { color: #11998e; text-decoration: none; font-weight: 500; }
        .back-link { display: inline-block; margin-top: 15px; color: #666; text-decoration: none; }
        .back-link:hover { color: #11998e; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📝 Регистрация</h1>
        <form onsubmit="alert('Зарегистрировано!'); return false;">
            <div class="form-group"><label for="name">Имя пользователя *</label><input type="text" id="name" required placeholder="Ваше имя"></div>
            <div class="form-group"><label for="email">Email *</label><input type="email" id="email" required placeholder="Ваш email"></div>
            <div class="form-group"><label for="password">Пароль *</label><input type="password" id="password" required placeholder="Придумайте пароль"></div>
            <button type="submit">Зарегистрироваться</button>
        </form>
        <div class="links">
            <p>Уже есть аккаунт? <a href="login.html">Войти</a></p>
            <a href="index.html" class="back-link">← На главную</a>
        </div>
    </div>
</body>
</html>
