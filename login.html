<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Вход</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { min-height: 100vh; background: linear-gradient(135deg, #8E2DE2, #4A00E0); display: flex; justify-content: center; align-items: center; padding: 20px; }
        .container { background: white; border-radius: 20px; padding: 40px; max-width: 450px; width: 100%; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
        h1 { color: #333; text-align: center; margin-bottom: 30px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; color: #333; margin-bottom: 8px; font-weight: 500; }
        input { width: 100%; padding: 12px 15px; border: 2px solid #ddd; border-radius: 10px; font-size: 1em; }
        input:focus { outline: none; border-color: #8E2DE2; }
        button { width: 100%; padding: 15px; background: linear-gradient(135deg, #8E2DE2, #4A00E0); color: white; border: none; border-radius: 10px; font-size: 1.1em; cursor: pointer; transition: all 0.3s ease; margin-top: 10px; }
        button:hover { transform: translateY(-3px); box-shadow: 0 10px 20px rgba(142,45,226,0.4); }
        .links { text-align: center; margin-top: 20px; }
        .links a { color: #8E2DE2; text-decoration: none; font-weight: 500; }
        .back-link { display: inline-block; margin-top: 15px; color: #666; text-decoration: none; }
        .back-link:hover { color: #8E2DE2; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔐 Вход в систему</h1>
        <form onsubmit="alert('Вход выполнен!'); return false;">
            <div class="form-group"><label for="email">Email *</label><input type="email" id="email" required placeholder="Ваш email"></div>
            <div class="form-group"><label for="password">Пароль *</label><input type="password" id="password" required placeholder="Ваш пароль"></div>
            <button type="submit">Войти</button>
        </form>
        <div class="links">
            <p>Нет аккаунта? <a href="register.html">Зарегистрироваться</a></p>
            <p style="margin-top:10px"><a href="#">Забыли пароль?</a></p>
            <a href="index.html" class="back-link">← На главную</a>
        </div>
    </div>
</body>
</html>
